name: Deploy to Laravel Forge

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build (optional - uncomment if you want to test build before deploy)
        # run: npm run build

      - name: Trigger Forge Deployment
        run: |
          curl -X POST "${{ secrets.FORGE_DEPLOY_HOOK_URL }}"
        continue-on-error: false
